name: Build latest Rugare APK

on:
  push:
    branches:
      - build-latest-rugare-apk
    paths:
      - .github/workflows/build-latest-rugare-apk.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: build-latest-rugare-apk

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run web tests
        run: npm test

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android tests and build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :android:testDebugUnitTest :android:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rugare-tv-1.6.10-latest-debug
          path: android/build/outputs/apk/debug/android-debug.apk
          if-no-files-found: error
