name: Fix FanCode routing and build

on:
  push:
    branches:
      - fix-fancode-webview

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: fix-fancode-webview
          fetch-depth: 0

      - name: Apply FanCode external-routing fix
        shell: python
        run: |
          from pathlib import Path

          java_path = Path('android/src/main/java/com/mangezi/ftaiptv/InAppBrowserActivity.java')
          text = java_path.read_text()

          old_on_create = '''        externalUrl = initialUrl;\n        buildLayout();\n        createWebView(initialUrl);\n        webView.loadUrl(normalizeUrl(initialUrl));'''
          new_on_create = '''        externalUrl = initialUrl;\n        if (isFanCodeUrl(initialUrl)) {\n            openFanCodeExternally(initialUrl);\n            return;\n        }\n        buildLayout();\n        createWebView(initialUrl);\n        webView.loadUrl(normalizeUrl(initialUrl));'''
          if old_on_create not in text:
              raise SystemExit('FanCode onCreate patch anchor not found')
          text = text.replace(old_on_create, new_on_create, 1)

          browser_anchor = '''    private void openExternally() {'''
          browser_method = '''    private void openFanCodeExternally(String url) {\n        String packageName = televisionDevice ? "com.fancode.tv" : "com.dream11sportsguru";\n\n        Intent appLinkIntent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));\n        appLinkIntent.addCategory(Intent.CATEGORY_BROWSABLE);\n        appLinkIntent.setPackage(packageName);\n        if (appLinkIntent.resolveActivity(getPackageManager()) != null) {\n            startActivity(appLinkIntent);\n            finish();\n            return;\n        }\n\n        Intent launchIntent = televisionDevice\n                ? getPackageManager().getLeanbackLaunchIntentForPackage(packageName)\n                : getPackageManager().getLaunchIntentForPackage(packageName);\n        if (launchIntent == null && televisionDevice) {\n            launchIntent = getPackageManager().getLaunchIntentForPackage(packageName);\n        }\n        if (launchIntent != null) {\n            launchIntent.addFlags(Intent.FLAG_ACTIVITY_CLEAR_TOP);\n            startActivity(launchIntent);\n            finish();\n            return;\n        }\n\n        try {\n            Intent browserIntent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));\n            browserIntent.addCategory(Intent.CATEGORY_BROWSABLE);\n            startActivity(Intent.createChooser(\n                    browserIntent,\n                    getString(R.string.choose_browser)\n            ));\n            finish();\n        } catch (ActivityNotFoundException ignored) {\n            Toast.makeText(this, getString(R.string.no_compatible_app), Toast.LENGTH_SHORT).show();\n            finish();\n        }\n    }\n\n'''
          if browser_anchor not in text:
              raise SystemExit('Browser method patch anchor not found')
          text = text.replace(browser_anchor, browser_method + browser_anchor, 1)

          url_anchor = '''    private static boolean isHttpUrl(String url) {'''
          url_method = '''    private static boolean isFanCodeUrl(String url) {\n        if (!isHttpUrl(url)) return false;\n        String host = Uri.parse(url).getHost();\n        if (host == null) return false;\n        String normalizedHost = host.toLowerCase(Locale.US);\n        return "fancode.com".equals(normalizedHost)\n                || normalizedHost.endsWith(".fancode.com");\n    }\n\n'''
          if url_anchor not in text:
              raise SystemExit('URL helper patch anchor not found')
          text = text.replace(url_anchor, url_method + url_anchor, 1)
          java_path.write_text(text)

          replacements = {
              Path('android/build.gradle.kts'): [
                  ('val appVersionCode = 36', 'val appVersionCode = 37'),
                  ('val appVersionName = "1.6.9"', 'val appVersionName = "1.6.10"'),
              ],
              Path('src/constants.js'): [
                  ("export const APP_VERSION = '1.6.9';", "export const APP_VERSION = '1.6.10';"),
              ],
              Path('android/src/main/res/values/strings.xml'): [
                  ('<string name="app_version">1.6.9</string>', '<string name="app_version">1.6.10</string>'),
              ],
              Path('package.json'): [
                  ('"version": "1.6.9"', '"version": "1.6.10"'),
              ],
          }
          for path, pairs in replacements.items():
              value = path.read_text()
              for old, new in pairs:
                  if old not in value:
                      raise SystemExit(f'Version patch anchor not found in {path}: {old}')
                  value = value.replace(old, new, 1)
              path.write_text(value)

          Path('test/fancodeRouting.test.js').write_text('''import { test } from 'node:test';\nimport assert from 'node:assert/strict';\nimport { readFileSync } from 'node:fs';\n\nconst browserSource = readFileSync(\n  new URL('../android/src/main/java/com/mangezi/ftaiptv/InAppBrowserActivity.java', import.meta.url),\n  'utf8',\n);\n\ntest('FanCode bypasses Rugare embedded WebView on Android', () => {\n  assert.match(browserSource, /isFanCodeUrl\\(initialUrl\\)/);\n  assert.match(browserSource, /openFanCodeExternally\\(initialUrl\\)/);\n  assert.match(browserSource, /com\\.dream11sportsguru/);\n  assert.match(browserSource, /com\\.fancode\\.tv/);\n  assert.match(browserSource, /Intent\\.createChooser/);\n});\n''')

          Path('.github/workflows/fix-fancode-routing.yml').unlink()

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run web tests
        run: npm test

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android unit tests and build APK
        run: |
          chmod +x gradlew
          ./gradlew :android:testDebugUnitTest :android:assembleDebug

      - name: Commit verified fix
        run: |
          git config user.name "mangezi"
          git config user.email "mangezi@mangezi.xyz"
          git add -A
          git commit -m "Fix FanCode Android routing"
          git push origin HEAD:fix-fancode-webview

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rugare-tv-1.6.10-fancode-fixed-debug
          path: android/build/outputs/apk/debug/android-debug.apk
          if-no-files-found: error
          retention-days: 30
