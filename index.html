<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Rugare TV</title>
  <base id="player-base" href="./" />
  <script>
    if (/\/tv\/[a-z0-9-]+\/?$/i.test(window.location.pathname)) {
      document.getElementById('player-base').href = '/tv/';
    } else if (/^\/[a-z0-9-]+\/?$/i.test(window.location.pathname)
      && window.location.pathname !== '/tv/') {
      document.getElementById('player-base').href = '/';
    }
  </script>
  <link rel="icon" href="https://mangezi.xyz/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css?v=20260808b" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
</head>
<body>
  <main class="layout">
    <button id="drawer-handle" class="drawer-handle" type="button" aria-label="Show channels" aria-expanded="false"></button>
    <div class="sidebar-column">
      <div id="app">Loading channels...</div>
      <button id="retry-button" type="button" hidden>Retry loading channels</button>
    </div>
    <section class="player-panel">
      <div class="player-frame">
        <video id="video" playsinline></video>
        <div id="player-placeholder" class="player-placeholder" role="status" aria-live="polite">
          <img class="player-placeholder-logo" src="assets/branding/rugare-tv-logo.png" alt="Rugare TV" />
          <span id="player-placeholder-label">Choose a channel</span>
        </div>
        <a id="website-link" class="player-website-link" href="https://mangezi.xyz/" data-in-app-browser="true" title="Back to mangezi.xyz">Website</a>
        <button id="fullscreen-toggle" class="fullscreen-toggle" type="button" aria-label="Enter full screen" aria-pressed="false" title="Full screen">
          <img src="assets/icons/fullscreen.svg" alt="" aria-hidden="true" />
        </button>
        <div class="landscape-channel-nav" aria-label="Channel navigation">
          <button id="previous-channel-button" class="channel-nav-button" type="button" aria-label="Previous channel" disabled></button>
          <button id="play-pause-button" class="channel-nav-button" type="button" aria-label="Play" aria-pressed="false" data-playing="false" disabled></button>
          <button id="next-channel-button" class="channel-nav-button" type="button" aria-label="Next channel" disabled></button>
        </div>
        <nav id="featured-service-list" class="featured-service-list" aria-label="Official TV services"></nav>
        <button id="player-orientation-toggle" class="orientation-toggle player-orientation-toggle" type="button" aria-label="Switch to landscape" title="Rotate player">
          <span class="orientation-glyph" aria-hidden="true">
            <span class="orientation-device"></span>
            <span class="orientation-arc orientation-arc-top"></span>
            <span class="orientation-arc orientation-arc-bottom"></span>
          </span>
        </button>
        <div id="player-hud" class="player-hud" aria-live="polite" hidden>
          <span class="player-hud-artwork">
            <img id="player-hud-logo" alt="" />
            <span id="player-hud-fallback" aria-hidden="true">TV</span>
          </span>
          <span class="player-hud-copy">
            <strong id="player-hud-title">Choose a channel</strong>
            <span id="player-hud-meta">Live TV</span>
          </span>
        </div>
      </div>
      <section id="now-playing-summary" class="now-playing-summary" aria-live="polite" hidden>
        <span class="now-playing-artwork">
          <img id="now-playing-logo" alt="" />
          <span id="now-playing-fallback" aria-hidden="true">TV</span>
        </span>
        <span class="now-playing-copy">
          <span id="now-playing-state" class="now-playing-state">Now playing</span>
          <strong id="now-playing-title">Choose a channel</strong>
          <span id="now-playing-category" class="now-playing-category">Live TV</span>
        </span>
        <span class="now-playing-actions">
          <button id="settings-toggle" class="settings-toggle" type="button" aria-label="Open settings" title="Settings">
            <span class="hamburger-icon" aria-hidden="true"></span>
          </button>
          <button id="now-playing-favorite" class="now-playing-favorite" type="button" aria-label="Add current channel to favorites">☆</button>
        </span>
      </section>
      <p id="player-status" hidden></p>
    </section>
  </main>
  <script>
    window.__rugareTvReady = false;
    window.setTimeout(() => {
      if (window.__rugareTvReady) return;
      const root = document.getElementById('app');
      if (!root || root.textContent.trim() !== 'Loading channels...') return;
      root.textContent = 'Rugare TV could not finish loading. Reload to try again.';
      const retryButton = document.getElementById('retry-button');
      if (!retryButton) return;
      retryButton.hidden = false;
      retryButton.textContent = 'Reload';
      retryButton.onclick = () => window.location.reload();
    }, 12000);
  </script>
  <script type="module" src="app.js?v=20260808b"></script>
</body>
</html>
